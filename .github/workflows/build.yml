# Build the desktop packages and attach them to a release.
#
# The assets are not in the repository, so every build fetches and rebuilds
# them first. That download is the slow part, so it is cached on the hash of
# the pipeline's own sources and the sprites the repository keeps (data/vendor,
# data/authored/sprites) — a change to either invalidates it, a change to the
# game code does not.
name: Build

on:
  push:
    tags: ['v*']
  # Releasing by hand as well as by tag. Pushing a tag is not always available
  # — some checkouts hold credentials that may push branches but not tags — and
  # the workflow's own token can create the tag, so the release is reachable
  # either way. Left empty, a dispatch only builds — a test build to download
  # from the run page, which can also be narrowed to the one OS being tried.
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release under this tag (e.g. v0.1). Empty = build only.'
        required: false
        default: ''
      platforms:
        description: 'Which OS to build. A release needs all.'
        type: choice
        options: [all, win, mac, linux]
        default: all

permissions:
  contents: write

jobs:
  # A release is put together as a draft first: every platform's build adds
  # its packages to it straight from its own job, and it is published only
  # once all three have. The packages used to pass through the Actions
  # artifact store on their way, which counts against the account's storage
  # and stopped a release outright the day it was full.
  prepare:
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release_tag != '' && inputs.platforms == 'all')
    runs-on: ubuntu-latest
    steps:
      # What changed, from the description of the pull request the release was
      # merged by. GitHub's generated notes listed only that pull request's
      # title, and closed on a link comparing this tag with the last one —
      # which goes nowhere once the old releases and their tags are cleared
      # away. The description is what says what the release is.
      - name: Read the release notes from its pull request
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version='${{ inputs.release_tag || github.ref_name }}'
          version="${version#v}"
          # A tag goes on the merge commit of the release's pull request, so
          # that commit's merged pull request is the release's.
          # A failed lookup prints its error where the answer would go, so it
          # counts as no pull request rather than as one.
          pr=$(gh api 'repos/${{ github.repository }}/commits/${{ github.sha }}/pulls' \
            --jq '[.[] | select(.merged_at != null)][0] // empty' 2>/dev/null) || pr=''
          {
            echo 'text<<NOTES_END'
            if [ -n "$pr" ]; then
              echo "## What's new in $version"
              echo
              # Its opening "The x release." line, the version bump and the
              # generated-with footer tell a player nothing; the blank lines
              # those leave at either end go with them.
              jq -r '.body // ""' <<<"$pr" | tr -d '\r' \
                | grep -v -E '^The .* release\.$|^- Version [0-9.]+\.?$|Generated with \[Claude Code\]' \
                | awk 'NF { while (blank > 0 && seen) { print ""; blank-- } blank = 0; seen = 1; print; next } { blank++ }'
              echo
              echo "Full list of changes: $(jq -r '.html_url' <<<"$pr")"
            fi
            echo 'NOTES_END'
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          # The dispatched tag is created at this commit if it does not exist.
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          draft: true
          body: |
            A desktop tamagotchi: in a small window that always floats on top of your screen, a Pokémon travels,
            battles, farms items and grows up on its own.

            ${{ steps.notes.outputs.text }}

            ## Download

            | OS | File |
            | --- | --- |
            | Windows | `*-win-x64.zip` — unzip it and run `Pokemon Desktop Companion.exe` |
            | macOS | Apple silicon (M1 and later) `*-mac-arm64.dmg` · Intel `*-mac-x64.dmg` |
            | Linux | `*-linux-x86_64.AppImage` |

            ## The first launch

            This is a personal fan project with no signing certificate, so your OS will block it once. You only have to
            get past it the one time.

            - **Windows** — there is no installer; just unzip it. If a "Windows protected your PC" window appears,
              choose **More info → Run anyway**.
            - **macOS** — **right-click the app → Open → Open**. If it is still blocked, run this in Terminal:
              `xattr -dr com.apple.quarantine "/Applications/Pokemon Desktop Companion.app"`
            - **Linux** — `chmod +x *.AppImage`, then run it.

            ## Good to know

            - The window is small and always stays on top. Hover over the top of the window and a drag bar appears; its
              position and size are remembered.
            - The three save slots and your settings are stored outside the app (`userData`), so they survive an update.
            - Progress is saved automatically every 5 minutes, and **Save and quit** in the settings closes the game.

            ---

            This is a non-commercial fan project. All rights to Pokémon and its related names, images and music belong
            to Nintendo / Creatures Inc. / GAME FREAK inc.


      # A release outlives the build that made it: drop a target and its last
      # package would sit on the release forever, since an upload only ever
      # adds and replaces. Whatever an earlier build left is cleared, so the
      # release holds exactly what this build uploads.
      - name: Clear packages an earlier build left
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag='${{ inputs.release_tag || github.ref_name }}'
          gh release view "$tag" --repo '${{ github.repository }}' --json assets --jq '.assets[].name' |
          while read -r asset; do
            [ -n "$asset" ] || continue
            echo "removing old asset: $asset"
            gh release delete-asset "$tag" "$asset" --repo '${{ github.repository }}' --yes
          done

  package:
    needs: prepare
    # A build-only dispatch has no release to prepare, and builds all the same.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        # A tag push has no inputs, so it falls through to all three.
        include: >-
          ${{ fromJSON(
            inputs.platforms == 'win' && '[{"os":"windows-latest","platform":"win"}]' ||
            inputs.platforms == 'mac' && '[{"os":"macos-latest","platform":"mac"}]' ||
            inputs.platforms == 'linux' && '[{"os":"ubuntu-latest","platform":"linux"}]' ||
            '[{"os":"ubuntu-latest","platform":"linux"},{"os":"windows-latest","platform":"win"},{"os":"macos-latest","platform":"mac"}]'
          ) }}
    runs-on: ${{ matrix.os }}

    steps:
      # The release job keeps the release to exactly what this run built, so a
      # release from one OS would strip the other two from it.
      - name: Refuse a release from part of the platforms
        if: inputs.release_tag != '' && inputs.platforms != 'all'
        run: |
          echo "::error::A release needs every platform; set platforms to 'all' or leave release_tag empty."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache built assets
        uses: actions/cache@v4
        with:
          path: |
            assets
            data/generated
            .cache
          key: assets-${{ hashFiles('dev/tools/**/*.mjs', 'package-lock.json', 'data/vendor/**', 'data/authored/sprites/**') }}

      - name: Build assets
        run: npm run assets

      - run: npm run typecheck
      - run: npm test

      - name: Package
        # There are no signing certificates for a fan project, so the macOS
        # build is left unsigned rather than failing on a missing identity.
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --${{ matrix.platform }} --publish never

      - name: Add the packages to the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          files=(dist/*.zip dist/*.dmg dist/*.AppImage)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::No packages were built"; exit 1; fi
          gh release upload '${{ inputs.release_tag || github.ref_name }}' "${files[@]}" --clobber --repo '${{ github.repository }}'

      # A build-only dispatch has no release to add to, so its packages stay a
      # few days on the run page for someone to fetch.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag == ''
        with:
          name: ${{ matrix.platform }}
          retention-days: 3
          path: |
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  release:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v') || (inputs.release_tag != '' && inputs.platforms == 'all')
    runs-on: ubuntu-latest
    steps:
      # Published rather than left a draft: this only runs when all three
      # platform builds succeeded, and a draft nobody can download is not a
      # release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit '${{ inputs.release_tag || github.ref_name }}' --draft=false --latest --repo '${{ github.repository }}'
